<style id="app-style">
:root{
  --bg:#0F1C2E; --surface:#152740; --surface-2:#1B3150; --line:#27446A; --grid:rgba(120,170,230,.09);
  --text:#E4ECF5; --muted:#93A9C3; --accent:#4CC2FF; --accent-ink:#06233A; --metric:#FFB547; --ok:#4EDB9C;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EFF4FA; --surface:#FFFFFF; --surface-2:#F4F8FC; --line:#CCDAE9; --grid:rgba(30,90,160,.08);
    --text:#12253C; --muted:#50667F; --accent:#0A74B8; --accent-ink:#FFFFFF; --metric:#A45F00; --ok:#11875A;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EFF4FA; --surface:#FFFFFF; --surface-2:#F4F8FC; --line:#CCDAE9; --grid:rgba(30,90,160,.08);
  --text:#12253C; --muted:#50667F; --accent:#0A74B8; --accent-ink:#FFFFFF; --metric:#A45F00; --ok:#11875A;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1C2E; --surface:#152740; --surface-2:#1B3150; --line:#27446A; --grid:rgba(120,170,230,.09);
  --text:#E4ECF5; --muted:#93A9C3; --accent:#4CC2FF; --accent-ink:#06233A; --metric:#FFB547; --ok:#4EDB9C;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1rem;line-height:1.6;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px;
}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}

/* ---------- hero ---------- */
.hero{padding:clamp(2.5rem,7vw,5rem) 0 clamp(2rem,5vw,3rem)}
.prompt{font-family:var(--mono);font-size:.95rem;color:var(--muted);margin:0 0 1.25rem;min-height:1.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prompt .sig{color:var(--ok)}
.prompt .caret{display:inline-block;width:.55em;height:1.05em;background:var(--accent);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.name{font-family:var(--mono);font-weight:700;font-size:clamp(2.4rem,7.5vw,4.6rem);line-height:1.02;letter-spacing:-.035em;margin:0}
.name .brace{color:var(--accent);font-weight:500}
.role{font-family:var(--mono);font-size:clamp(1rem,2.2vw,1.2rem);color:var(--accent);margin:.9rem 0 0}
.intro{max-width:62ch;font-size:1.08rem;margin:1.4rem 0 0;color:var(--text)}
.spec{display:grid;grid-template-columns:max-content 1fr;gap:.2rem 1.25rem;font-family:var(--mono);font-size:.88rem;margin:1.6rem 0 0;padding:1rem 1.25rem;border-left:3px solid var(--accent);background:var(--surface);max-width:640px}
.spec dt{color:var(--muted)}
.spec dd{margin:0}
.spec .live{color:var(--ok)}
.spec .live::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--ok);margin-right:.45em;vertical-align:.05em}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.75rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.9rem;font-weight:500;padding:.6rem 1rem;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- console layout ---------- */
.console{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:4rem}
.nav{border-right:1px solid var(--line);background:var(--surface-2);padding:1rem .6rem;display:flex;flex-direction:column;gap:.15rem}
.nav-title{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding:.2rem .7rem .7rem}
.tab{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:.6rem;width:100%;padding:.6rem .7rem;border-radius:6px;font-family:var(--mono);font-size:.92rem;color:var(--muted);cursor:pointer;min-height:44px}
.tab:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tab[aria-selected="true"]{color:var(--text);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab .ico{width:18px;height:18px;flex:none;color:var(--accent)}
.panel{padding:clamp(1.25rem,3.5vw,2.25rem);min-width:0}
.panel[hidden]{display:none}
.crumb{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin:0 0 .35rem}
.crumb b{color:var(--accent);font-weight:500}
.panel h2{font-family:var(--mono);font-weight:700;font-size:clamp(1.5rem,3.2vw,2rem);letter-spacing:-.02em;margin:0 0 1.5rem;line-height:1.15}
.panel h3{font-family:var(--mono);font-size:1.12rem;margin:0;line-height:1.35}
.panel h4{font-family:var(--mono);font-size:.95rem;font-weight:600;color:var(--accent);margin:1.5rem 0 .5rem}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem;color:var(--muted);font-size:.93rem;margin:.3rem 0 0}
.meta .when{font-family:var(--mono);font-size:.85rem}
ul.pts{margin:.4rem 0 0;padding-left:1.1rem;max-width:78ch}
ul.pts li{margin:.45rem 0}
ul.pts li::marker{color:var(--accent)}
.m{font-family:var(--mono);font-weight:600;color:var(--metric);font-size:.95em}
.entry+.entry{margin-top:2.25rem;padding-top:2rem;border-top:1px dashed var(--line)}
.stack{display:flex;flex-wrap:wrap;gap:.35rem;margin:.75rem 0 0;padding:0;list-style:none}
.stack li{font-family:var(--mono);font-size:.78rem;padding:.15rem .5rem;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge{display:inline-block;font-family:var(--mono);font-size:.8rem;color:var(--metric);border:1px solid color-mix(in srgb,var(--metric) 55%,transparent);border-radius:4px;padding:.1rem .45rem;margin-top:.5rem}
.ext{font-family:var(--mono);font-size:.85rem;margin-left:.4rem;white-space:nowrap}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem}
.skill-group{border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;background:var(--surface-2)}
.skill-group h3{font-size:.95rem;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;margin:.75rem 0 0;padding:0}
.chips li{font-size:.86rem;padding:.2rem .6rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text)}

.creds{display:grid;gap:1.75rem}
.cred-list{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.5rem}
.cred-list li{display:flex;gap:.6rem;align-items:baseline}
.cred-list li::before{content:"✓";font-family:var(--mono);color:var(--ok);flex:none}

/* ---------- resume ---------- */
.resume-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.stamp{font-family:var(--mono);font-size:.88rem;color:var(--muted)}
.stamp b{color:var(--text);font-weight:500}
.resume-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.upload{position:relative}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.status{font-family:var(--mono);font-size:.86rem;margin:0 0 1rem;padding:.6rem .8rem;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)}
.status[hidden]{display:none}
.status.err{border-color:#E0605E;color:#E0605E}
.pages{display:grid;gap:1rem;overflow-x:auto}
.pages canvas{width:100%;max-width:100%;height:auto;display:block;border-radius:4px;box-shadow:0 0 0 1px var(--line);background:#fff}
.pages .note{color:var(--muted);font-family:var(--mono);font-size:.9rem;padding:2rem 0}

/* ---------- contact ---------- */
.contact{list-style:none;margin:0;padding:0;display:grid;gap:.75rem;max-width:620px}
.contact li{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:1rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.contact .k{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.contact .v{overflow-wrap:anywhere}
.copy{all:unset;cursor:pointer;font-family:var(--mono);font-size:.8rem;color:var(--accent);padding:.35rem .5rem;border-radius:4px}
.copy:focus-visible{outline:2px solid var(--accent)}

.linkbtn{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.8rem;font-weight:500;padding:.3rem .65rem;border:1px solid var(--line);border-radius:5px;color:var(--accent);text-decoration:none;white-space:nowrap;min-height:32px}
.linkbtn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.linkbtn svg{width:14px;height:14px;flex:none}
.cred-list li{justify-content:space-between;flex-wrap:wrap;padding:.55rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.cred-list .cn{display:flex;gap:.6rem;align-items:baseline;flex:1 1 240px}
.cred-list li::before{content:none}
.cred-list .cn::before{content:"✓";font-family:var(--mono);color:var(--ok);flex:none}
.entry-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem}
.langs{list-style:none;margin:.6rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.4rem 2rem;max-width:560px}
.langs li{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
footer{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding:0 0 3rem}

@media (max-width:760px){
  .console{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.5rem;position:sticky;top:0;z-index:2}
  .nav-title{display:none}
  .tab{width:auto;flex:none;padding:.5rem .8rem}
  .tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .contact li{grid-template-columns:1fr auto}
  .contact .k{grid-column:1/-1}
  .spec{grid-template-columns:1fr;gap:0}
  .spec dd{margin-bottom:.4rem}
}
@media (prefers-reduced-motion:reduce){.prompt .caret{animation:none}}
</style>

        <span class="badge">Google Patchamomma 2026: ranked 58th of 3,500</span>
        <ul class="pts">
          <li>Engineered a banking data platform on Azure Databricks and Snowflake with a Bronze–Silver–Gold medallion architecture, incremental ingestion, SCD Type 1/2 processing and Delta Lake storage on Azure Data Lake Storage (ADLS Gen2) across customer, account, transaction, loan and risk domains.</li>
          <li>Automated orchestration with Airflow and data quality validation in Databricks across <span class="m">16</span> source tables, with audit tables tracking run status, row counts and file-level metadata for every run; versioned in Git with stage-by-stage deployment.</li>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script id="app-script">
(function(){
  var PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  var tpl = document.getElementById("page-tpl");
  var app = document.getElementById("app");
  app.appendChild(tpl.content.cloneNode(true));
  var $ = function(s){ return app.querySelector(s); };

  /* ---- typed command (one load moment) ---- */
  var cmd = "cloud describe profile --user shruti-mokhashi";
  var typed = $("#typed");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) typed.textContent = cmd;
  else { var i = 0; (function step(){ typed.textContent = cmd.slice(0, ++i); if (i < cmd.length) setTimeout(step, 28 + Math.random()*40); })(); }

  /* ---- tabs ---- */
  var tabs = Array.prototype.slice.call(app.querySelectorAll(".tab"));
  function show(name, focus){
    tabs.forEach(function(t){
      var on = t.dataset.tab === name;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      if (on && focus) t.focus();
    });
    if (name === "resume") renderPdf();
    try { history.replaceState(null, "", "#" + name); } catch(e){}
  }
  tabs.forEach(function(t, idx){
    t.addEventListener("click", function(){ show(t.dataset.tab); });
    t.addEventListener("keydown", function(e){
      var d = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1 : (e.key === "ArrowUp" || e.key === "ArrowLeft") ? -1 : 0;
      if (!d) return; e.preventDefault();
      show(tabs[(idx + d + tabs.length) % tabs.length].dataset.tab, true);
    });
  });
  app.querySelectorAll("[data-goto]").forEach(function(b){
    b.addEventListener("click", function(){ show(b.dataset.goto); $(".console").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"}); });
  });
  var start = (location.hash || "").slice(1);
  show(tabs.some(function(t){ return t.dataset.tab === start; }) ? start : "experience");

  /* ---- copy ---- */
  app.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click", function(){
      var done = function(){ b.textContent = "copied"; setTimeout(function(){ b.textContent = "copy"; }, 1600); };
      try { navigator.clipboard.writeText(b.dataset.copy).then(done, function(){ b.textContent = "select + copy"; }); }
      catch(e){ b.textContent = "select + copy"; }
    });
  });

  /* ---- timestamp: date resume.pdf was last committed ---- */
  var REPO = "ShrutiMokhashi34/ShrutiMokhashi34.github.io";
  function fmt(d){
    try { return new Intl.DateTimeFormat(undefined, {dateStyle:"medium", timeStyle:"short"}).format(d); }
    catch(e){ return d.toISOString(); }
  }
  function setStamp(d){ if (!d || isNaN(d)) return; $("#stamp").textContent = fmt(d); $("#stamp").title = d.toISOString(); }
  fetch("https://api.github.com/repos/" + REPO + "/commits?path=resume.pdf&per_page=1")
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(c){ setStamp(new Date(c[0].commit.committer.date)); })
    .catch(function(){
      fetch("resume.pdf", {method:"HEAD", cache:"no-store"}).then(function(r){
        var lm = r.headers.get("Last-Modified"); if (lm) setStamp(new Date(lm));
      }).catch(function(){});
    });

  /* ---- pdf preview ---- */
  var rendered = false;
  async function renderPdf(){
    if (rendered) return; rendered = true;
    var holder = $("#pages");
    try {
      var lib = window.pdfjsLib;
      if (!lib) throw new Error("viewer unavailable");
      lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
      var res = await fetch("resume.pdf", {cache:"no-cache"});
      if (!res.ok) throw new Error("missing");
      var doc = await lib.getDocument({data: new Uint8Array(await res.arrayBuffer()), isEvalSupported:false}).promise;
      holder.innerHTML = "";
      for (var p = 1; p <= doc.numPages; p++){
        var page = await doc.getPage(p);
        var base = page.getViewport({scale:1});
        var vp = page.getViewport({scale: 1500 / base.width});
        var c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.setAttribute("role", "img");
        c.setAttribute("aria-label", "Resume page " + p + " of " + doc.numPages);
        holder.appendChild(c);
        await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      }
    } catch(e){
      holder.innerHTML = '<p class="note">The resume preview could not load. <a href="resume.pdf" target="_blank" rel="noopener">Open the PDF</a> instead.</p>';
    }
  }
  if (!$("#p-resume").hidden) renderPdf();
})();
</script>
